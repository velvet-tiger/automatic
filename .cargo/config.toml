# Shared Cargo config for this repository.
#
# Local machine overrides should live in your user-level Cargo config or shell
# environment. Keeping Homebrew-specific settings out of this repo prevents CI
# and cross-target release builds from forcing `pkg-config` on every platform.
#
# Example for Apple Silicon machines that need Homebrew zstd:
#
# [env]
# ZSTD_SYS_USE_PKG_CONFIG = "1"
# PKG_CONFIG_PATH = "/opt/homebrew/opt/zstd/lib/pkgconfig"

# Sign macOS dev binaries with a stable identity before running them, so that
# granting a keychain item to the app survives the next rebuild. Applies to
# `cargo run`, which is what `tauri dev` uses. Release builds go through
# `cargo build` and are signed by Tauri, so they are unaffected.
#
# Without the certificate installed this prints a warning and runs the binary
# unsigned. Run `make dev-signing-setup` once to install it.
[target.aarch64-apple-darwin]
runner = ".cargo/sign-dev-binary.sh"

[target.x86_64-apple-darwin]
runner = ".cargo/sign-dev-binary.sh"
