# Shared Cargo config for this repository.
#
# Local machine overrides should live in your user-level Cargo config or shell
# environment. Keeping Homebrew-specific settings out of this repo prevents CI
# and cross-target release builds from forcing `pkg-config` on every platform.
#
# Example for Apple Silicon machines that need Homebrew zstd:
#
# [env]
# ZSTD_SYS_USE_PKG_CONFIG = "1"
# PKG_CONFIG_PATH = "/opt/homebrew/opt/zstd/lib/pkgconfig"
