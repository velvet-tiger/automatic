# ── Workspace ───────────────────────────────────────────────────────────────
# `cli-bin/` is a separate workspace member so its `[[bin]]` entry is invisible
# to Tauri's bundler (which scans the active crate's Cargo.toml and treats
# extra binaries as sidecars to lipo on macOS / copy into the installer
# everywhere). Both members share `target/`, so the produced
# `automatic-cli.exe` ends up next to the GUI binary at install time.
[workspace]
members = [".", "cli-bin"]

[package]
name = "automatic"
version = "1.36.0"
description = "Manage your AI dependencies"
authors = ["you"]
edition = "2021"
# Not a crates.io package. cargo-about also uses this to leave the app's own
# crate out of the third-party licence list.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "automatic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The GUI binary (windows-subsystem on release builds). All MCP and GUI
# dispatch flows through this entry point. The console-subsystem CLI
# binary lives in the `cli-bin/` workspace member; see that crate's
# `src/main.rs` for the rationale.
[[bin]]
name = "automatic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# On Linux, `linux-native` alone is the kernel keyring, which is emptied on
# reboot. `sync-secret-service` makes the Secret Service the default store.
# `crypto-rust` selects the Secret Service's Diffie-Hellman session, so secrets
# do not cross the D-Bus session bus as plain text. That session is not a
# security boundary: any process of the same user can read an unlocked keyring.
# `linux-native` stays so that secrets an older build left in the kernel
# keyring can still be read.
keyring = { version = "3.6.3", features = ["apple-native", "linux-native", "sync-secret-service", "crypto-rust", "windows-native"] }
dirs = "6.0.0"
chrono = { version = "0.4", features = ["serde"] }
# Explicit features so a change to rmcp's defaults cannot add code to the
# build. Only the stdio server and its #[tool] macros are needed.
rmcp = { version = "3.6", default-features = false, features = [
    "server", "macros", "transport-io",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "time"] }
url = "2"
glob = "0.3"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
urlencoding = "2"
toml = "1.0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
semver = "1"
minisign-verify = "0.2"
open = "5"
rand = "0.9"
aes-gcm = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tiktoken-rs = "0.9"
zip = "2"
regex = "1"
once_cell = "1"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }

# The Secret Service client that `keyring` uses. `core/secret_store.rs` calls
# it directly to confirm the default keyring is unlocked before each call.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = "4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
