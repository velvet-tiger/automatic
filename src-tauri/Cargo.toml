# ── Workspace ───────────────────────────────────────────────────────────────
# `cli-bin/` is a separate workspace member so its `[[bin]]` entry is invisible
# to Tauri's bundler (which scans the active crate's Cargo.toml and treats
# extra binaries as sidecars to lipo on macOS / copy into the installer
# everywhere). Both members share `target/`, so the produced
# `automatic-cli.exe` ends up next to the GUI binary at install time.
[workspace]
members = [".", "cli-bin"]

[package]
name = "automatic"
version = "1.13.1"
description = "Manage your AI dependencies"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "automatic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The GUI binary (windows-subsystem on release builds). All MCP and GUI
# dispatch flows through this entry point. The console-subsystem CLI
# binary lives in the `cli-bin/` workspace member; see that crate's
# `src/main.rs` for the rationale.
[[bin]]
name = "automatic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", features = ["apple-native", "linux-native", "windows-native"] }
dirs = "6.0.0"
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "1.6", features = [
    "server", "transport-io",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net"] }
url = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
urlencoding = "2"
toml = "1.0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
open = "5"
rand = "0.9"
aes-gcm = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tiktoken-rs = "0.9"
zip = "2"
regex = "1"
once_cell = "1"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
