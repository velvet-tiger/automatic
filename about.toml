# Configuration for cargo-about, which writes rust-crates.txt: the licence of
# every crate used to build the app for one release platform. The release
# workflow ships that file inside each app bundle, in the `licenses` resource
# folder, and the app shows it under Settings > Support.
# `scripts/third-party-licenses.sh` runs the tool. `make licenses` runs the
# script locally.

# Licences a dependency may carry. A crate offered under several is taken
# under the first one listed here. A crate with none of them fails the run, so
# a new licence is a decision someone makes, not something that slips in.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
]

# The app's own crates (`automatic` and `cli-bin`'s `automatic-cli`) are not
# third-party code. They are skipped because their Cargo.toml files set
# `publish = false`.
private = { ignore = true }

# Build scripts' dependencies are included. Some of their code, such as
# tauri-build's, is compiled into the app.
ignore-build-dependencies = false
ignore-dev-dependencies = true

# ── Licences accepted for named crates only ─────────────────────────────────
#
# MPL-2.0 covers each file of these crates. They are used unmodified, and the
# generated file says where each crate's source is, which is what MPL-2.0
# asks of a binary that contains them. option-ext comes in through dirs. The
# others come in through tauri-utils, which reads and rewrites HTML.
[option-ext]
accepted = ["MPL-2.0"]

[cssparser]
accepted = ["MPL-2.0"]

[cssparser-macros]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]

# Zlib asks only that the notice stays with the source. It is accepted per
# crate so that each new Zlib crate is still looked at.
[foldhash]
accepted = ["Zlib"]

# Linux only. A dependency of system-deps, which the GTK crates' build scripts
# use to find system libraries. The LLVM exception removes Apache-2.0's
# notice requirement for compiled code, but the text is shipped anyway.
[target-lexicon]
accepted = ["Apache-2.0 WITH LLVM-exception"]

# Linux only. Public-domain dedication, with a fallback licence that needs no
# notice.
[tiny-keccak]
accepted = ["CC0-1.0"]

# ── Clarifications ────────────────────────────────────────────────────────────
#
# cargo-about finds a crate's licence text by looking for licence files it
# recognises. The entries below name a file it would otherwise miss. Each
# checksum is the SHA-256 of that file.
#
# When a new crate version changes a file, cargo-about only warns and falls
# back to what it would have printed without the entry. The script turns that
# warning into a failure, so the entry is checked and updated before a
# release.
#
# An entry applies only when the crate is built for the target, so cargo-about
# warns that the others match no crate. That warning is expected.

# ── C libraries bundled inside a crate ────────────────────────────────────────
#
# These crates build a C library from source they carry and link it into the
# binary. The crate's declared licence covers only its Rust code, so each
# entry adds the C library's own licence. Its `license` joins the two with
# AND, and the script checks that the crate is listed under both.
#
# libdbus is not here. The app links the system's copy, so libdbus-sys
# builds none of it in. The Linux AppImage carries the system's libdbus, and
# its notice is in system-libraries.txt.
# SQLite (in libsqlite3-sys) and liblzma (in lzma-sys) are public domain.
# THIRD_PARTY_NOTICES.md names them.

# zstd, on every platform.
[zstd-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[[zstd-sys.clarify.files]]
path = "LICENSE.Mit"
license = "MIT"
checksum = "129e8edef29e9abcd2ebabe252f4ef1b1289cdca356bf0040284a2fbccfb96c8"

[[zstd-sys.clarify.files]]
path = "zstd/LICENSE"
license = "BSD-3-Clause"
checksum = "7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8"

# bzip2, on every platform.
[bzip2-sys]
accepted = ["bzip2-1.0.6"]

[bzip2-sys.clarify]
license = "(MIT OR Apache-2.0) AND bzip2-1.0.6"

[[bzip2-sys.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "c8c6324cf2f0f076e3ed5dea4a21f00bd4dd6fce44f72b110bc52e7fe06f6e1e"

[[bzip2-sys.clarify.files]]
