# Builds, signs and publishes a release from a tag.
# Unsigned branch test builds live in ci-build.yml.
name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - '**'

jobs:
  # Writes the licence list of the Rust crates in each platform's build. It is
  # a job of its own so that the third-party install action and the tool it
  # downloads never run in the build job, which signs the app and holds the
  # signing secrets. This job gets a read-only token and no secrets, and its
  # actions are pinned to commits. `build` restores no Actions cache, so this
  # job cannot reach it through one.
  licenses:
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the token is not left in .git/config.
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # Pinned to a commit, and the tool to a version, so that neither can
      # change under a release.
      - name: Install cargo-about
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2

      # Fails when a crate's licence is not accepted in about.toml, when a
      # licence file pinned there has changed, or when a crate would be
      # printed without its copyright line.
      - name: Generate for every release platform
        run: bash scripts/third-party-licenses.sh licenses

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-licenses
          path: licenses/*.txt
          if-no-files-found: error

  build:
    needs: licenses
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    # Tag builds upload release assets with GITHUB_TOKEN.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # `name` matches a file that scripts/third-party-licenses.sh writes.
        # Every leg bundles the licence files through tauri.release.conf.json.
        include:
          - name: darwin-universal
            os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,updater --config src-tauri/tauri.release.conf.json
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage --config src-tauri/tauri.release.conf.json
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis --config src-tauri/tauri.release.conf.json

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # build.rs packs the automatic-library submodule into the binary
          submodules: true
          # No step uses git with the token. tauri-action and gh read GITHUB_TOKEN from env.
          persist-credentials: false

      # This workflow holds the signing keys, so it restores no Actions cache.
      # Other jobs and workflows can write caches.
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Download the third-party licence files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: third-party-licenses
          path: licenses-artifact

      # tauri.release.conf.json bundles everything in src-tauri/licenses/.
      # The file comes from another job. Take it only as a plain file, so
      # that nothing else on this runner can be copied into a public bundle.
      # It must also be text and under 10 MB, so a bad file fails the build.
      - name: Stage the Rust crate licence file
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          licence_file="licenses-artifact/$MATRIX_NAME.txt"
          if [ ! -f "$licence_file" ] || [ -L "$licence_file" ]; then
            echo "::error::$licence_file is missing or is not a regular file"
            exit 1
          fi
          if [ "$(wc -c <"$licence_file")" -ge 10000000 ] || ! grep -Iq . "$licence_file"; then
            echo "::error::$licence_file is over 10 MB, empty, or not text"
            exit 1
          fi
          mkdir -p src-tauri/licenses
          cp "$licence_file" src-tauri/licenses/rust-crates.txt

      # The gdk-pixbuf TIFF loader needs libtiff, which needs libjbig. JBIG-KIT
      # is GPL-2+ only, and the AppImage would carry it. Setting the loader
      # aside keeps both out of the AppImage. TIFF images then load only where
      # the user's system has the loader. The Linux check at the end of this
      # job fails the build if libtiff or libjbig comes back.
      #
      # The loader moves to the folder above 2.10.0. linuxdeploy-plugin-gtk
      # copies the whole 2.10.0 folder, so a renamed copy left beside the
      # other loaders would still be bundled, with libtiff and libjbig.
      - name: Set aside the TIFF image loader (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          pixbuf_dir=/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0
          loader="$pixbuf_dir/2.10.0/loaders/libpixbufloader-tiff.so"
          sudo dpkg-divert --local --rename --divert "$pixbuf_dir/libpixbufloader-tiff.so.diverted" --add "$loader"
          sudo "$pixbuf_dir/gdk-pixbuf-query-loaders" --update-cache
          if find "$pixbuf_dir/2.10.0" -iname '*tiff*' | grep -q . || grep -qi tiff "$pixbuf_dir/2.10.0/loaders.cache"; then
            echo "::error::a TIFF loader is still in $pixbuf_dir/2.10.0"
            exit 1
          fi

      # Build the console-subsystem CLI binary and stage it where
      # tauri.windows.conf.json's `externalBin` entry expects to find it.
      # Tauri's externalBin convention requires the target-triple suffix.
      #
      # The placeholder file is needed because `cargo build -p automatic-cli`
      # transitively builds the parent `automatic` crate, whose `tauri-build`
      # build script validates that every `externalBin` path exists. Without
      # the placeholder, the parent's build script fails before cli-bin has
      # a chance to produce the real binary. We copy the real file over the
      # placeholder once cli-bin finishes; the subsequent `tauri build`
      # bundle step then ships the real binary inside the installer.
      - name: Build and stage automatic-cli (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri
          mkdir -p binaries
          touch binaries/automatic-cli-x86_64-pc-windows-msvc.exe
          cargo build --release -p automatic-cli
          cp target/release/automatic-cli.exe \
             binaries/automatic-cli-x86_64-pc-windows-msvc.exe

      # Import the Apple Developer ID certificate into the macOS keychain for signing.
      # The certificate goes to RUNNER_TEMP, not the workspace, and the final
      # step deletes the keychain and the file.
      - name: Import Apple Developer certificate
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # Increase keychain timeout to avoid relocking
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Grant codesign partition access to avoid UI prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      # On tag pushes: build, sign, notarize, and publish a draft release.
      # latest.json is generated by the separate `publish` job once all platforms are done.
      # includeUpdaterJson is disabled here because tauri-action has a bug where it
      # fails to find .sig files for universal macOS builds. The `publish` job handles it.
      - name: Build and publish Tauri app (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Fallbacks for tauri-bundler / xcrun notarytool natively
          AC_USERNAME: ${{ secrets.APPLE_ID }}
          AC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Brandfetch CDN client ID — inlined into the JS bundle at build time by Vite
          VITE_BRANDFETCH_CLIENT_ID: ${{ secrets.VITE_BRANDFETCH_CLIENT_ID }}
          # Baked into the Rust binary at compile time via option_env!()
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Automatic ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          # Disable tauri-action's built-in latest.json — it fails to find .sig files for
          # universal macOS builds. The `publish` job handles it.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Upload the macOS updater bundle explicitly. Depending on tauri-action to
      # publish the universal updater archive has been unreliable.
      - name: List macOS bundle output (diagnostic)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-latest'
        run: ls -la src-tauri/target/universal-apple-darwin/release/bundle/macos/ || true

      - name: Upload macOS updater bundle and signature
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          BUNDLE_DIR=src-tauri/target/universal-apple-darwin/release/bundle/macos
          APP_TAR_GZ=$(ls "$BUNDLE_DIR"/*.app.tar.gz 2>/dev/null | grep -v '\.sig' | head -1)
          SIG_FILE="${APP_TAR_GZ}.sig"

          if [ -z "$APP_TAR_GZ" ] || [ ! -f "$SIG_FILE" ]; then
            echo "ERROR: Could not find macOS updater archive or its .sig in $BUNDLE_DIR" >&2
            ls "$BUNDLE_DIR"/ || true
            exit 1
          fi

          gh release upload "$TAG" "$APP_TAR_GZ" "$SIG_FILE" --clobber

      - name: Stash macOS signature as workflow artifact
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sig-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: List Linux bundle output (diagnostic)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-22.04'
        run: ls -la src-tauri/target/release/bundle/appimage/ || true

      - name: Upload Linux updater bundle and signature
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          BUNDLE_DIR=src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls "$BUNDLE_DIR"/*.AppImage 2>/dev/null | grep -v '\.sig' | head -1)
          SIG_FILE="${APPIMAGE}.sig"

          if [ -z "$APPIMAGE" ] || [ ! -f "$SIG_FILE" ]; then
            echo "ERROR: Could not find AppImage or its .sig in $BUNDLE_DIR" >&2
            ls "$BUNDLE_DIR"/ || true
            exit 1
          fi

          gh release upload "$TAG" "$APPIMAGE" "$SIG_FILE" --clobber

      - name: Stash Linux signature as workflow artifact
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sig-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

      - name: List Windows bundle output (diagnostic)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        shell: bash
        run: ls -la src-tauri/target/release/bundle/nsis/ || true

      - name: Upload Windows updater bundle and signature
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          BUNDLE_DIR=src-tauri/target/release/bundle/nsis
          EXE=$(ls "$BUNDLE_DIR"/*-setup.exe 2>/dev/null | grep -v '\.sig' | head -1)
          SIG_FILE="${EXE}.sig"

          if [ -z "$EXE" ] || [ ! -f "$SIG_FILE" ]; then
            echo "ERROR: Could not find NSIS setup .exe or its .sig in $BUNDLE_DIR" >&2
            ls "$BUNDLE_DIR"/ || true
            exit 1
          fi

          gh release upload "$TAG" "$EXE" "$SIG_FILE" --clobber

      - name: Stash Windows signature as workflow artifact
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sig-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

      - name: Delete macOS signing keychain
        if: always() && matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/certificate.p12"

      # The checks below look inside the finished bundles. A tag build has
      # already uploaded them to the draft release by now. The draft stays
      # unpublished if a check fails, because `publish` needs this job.
      - name: Check the bundled licence files (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          dir=src-tauri/target/universal-apple-darwin/release/bundle/macos/Automatic.app/Contents/Resources/licenses
          listed=$(ls "$dir" | LC_ALL=C sort | tr '\n' ' ')
          expected="THIRD_PARTY_NOTICES.md interface.txt rust-crates.txt "
          if [ "$listed" != "$expected" ]; then
            echo "::error::$dir holds '$listed', expected '$expected'"
            exit 1
          fi

      - name: Check the bundled licence files (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          listing=$(7z l -ba "${installers[0]}" | tr -d '\r')
          # Every entry under a top-level licenses folder, as a path relative
          # to it, so a file in a subfolder shows up as an extra entry.
          listed=$(grep -oiE '(^|[\\/ ])licenses[\\/].+$' <<<"$listing" | sed -E 's#^[\\/ ]?[Ll][Ii][Cc][Ee][Nn][Ss][Ee][Ss][\\/]##' | LC_ALL=C sort | tr '\n' ' ' || true)
          expected="THIRD_PARTY_NOTICES.md interface.txt rust-crates.txt "
          if [ "$listed" != "$expected" ]; then
            echo "::error::${installers[0]} holds '$listed' in licenses, expected '$expected'"
            echo "$listing"
            exit 1
          fi

      - name: Check the bundled licence files (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          (cd "$RUNNER_TEMP" && rm -rf check && mkdir check && cd check && "$GITHUB_WORKSPACE/${appimages[0]}" --appimage-extract >/dev/null)
          root="$RUNNER_TEMP/check/squashfs-root"
          listed=$(ls "$root/usr/lib/Automatic/licenses" | LC_ALL=C sort | tr '\n' ' ')
          expected="THIRD_PARTY_NOTICES.md interface.txt rust-crates.txt "
          if [ "$listed" != "$expected" ]; then
            echo "::error::the AppImage's licenses folder holds '$listed', expected '$expected'"
            exit 1
          fi
          # libjbig is GPL-2+ only. See "Set aside the TIFF image loader".
          if find "$root" \( -name 'libjbig*' -o -name 'libtiff*' -o -name '*pixbufloader-tiff*' \) | grep .; then
            echo "::error::the AppImage carries libtiff or libjbig"
            exit 1
          fi

  # Runs after all platform builds succeed. Downloads the .sig workflow artifacts uploaded
  # by each build job, generates a valid latest.json, and uploads it to the draft release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Uploads latest.json and publishes the draft release with GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No step uses git with the token. gh reads GITHUB_TOKEN from env.
          persist-credentials: false

      - name: Download macOS signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sig-macos
          path: sigs/macos

      - name: Download Linux signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sig-linux
          path: sigs/linux

      - name: Download Windows signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sig-windows
          path: sigs/windows

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # The macOS release asset is uploaded with a stable public name.
          # The downloaded workflow artifact keeps the local build filename,
          # so do not derive the Darwin asset name from the .sig basename.
          DARWIN_FILE="Automatic_universal.app.tar.gz"
          LINUX_FILE=$(ls sigs/linux/*.AppImage.sig | xargs -I{} basename {} .sig)
          WINDOWS_FILE=$(ls sigs/windows/*-setup.exe.sig | xargs -I{} basename {} .sig)

          echo "Resolved artifact filenames:"
          echo "  Darwin:  $DARWIN_FILE"
          echo "  Linux:   $LINUX_FILE"
          echo "  Windows: $WINDOWS_FILE"

          export DARWIN_URL="${BASE_URL}/${DARWIN_FILE}"
          export LINUX_URL="${BASE_URL}/${LINUX_FILE}"
          export WINDOWS_URL="${BASE_URL}/${WINDOWS_FILE}"

          export PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 - <<'PYEOF'
          import glob
          import json
          import os
          import re
          from pathlib import Path


          def read_release_notes(version: str, tag: str) -> str:
              changelog_lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
              header_pattern = re.compile(r'^## \[(?P<version>[^\]]+)\]')
              target_versions = {version, tag, version.removeprefix('v'), tag.removeprefix('v')}

              current_version = None
              collected = []

              for line in changelog_lines:
                  header_match = header_pattern.match(line)
                  if header_match:
                      if current_version in target_versions:
                          break
                      current_version = header_match.group('version')
                      continue

                  if current_version not in target_versions:
                      continue

                  if line.strip() == '---':
                      break

                  collected.append(line)

              notes = '\n'.join(collected).strip()
              if not notes:
                  targets = ', '.join(sorted(target_versions))
                  print(f'WARNING: Could not find changelog notes for release version/tag: {targets}')
                  return ''

              return notes

          darwin_sig_f = glob.glob('sigs/macos/*.app.tar.gz.sig')[0]
          darwin_sig  = open(darwin_sig_f).read().strip()
          linux_sig_f = glob.glob('sigs/linux/*.AppImage.sig')[0]
          linux_sig   = open(linux_sig_f).read().strip()
          win_sig_f   = glob.glob('sigs/windows/*-setup.exe.sig')[0]
          win_sig     = open(win_sig_f).read().strip()
          release_notes = read_release_notes(os.environ['VERSION'], os.environ['TAG'])

          # Persist notes to a file so the next step can pass them to `gh release edit`.
          # Fall back to a pointer to CHANGELOG.md if the tag has no matching entry.
          tag = os.environ['TAG']
          repo = os.environ['REPO']
          if release_notes:
              notes_for_release = release_notes
          else:
              notes_for_release = (
                  f'Release notes for `{tag}` were not found in '
                  f'[CHANGELOG.md](https://github.com/{repo}/blob/{tag}/CHANGELOG.md). '
                  'See the changelog for details.'
              )
          Path('release-notes.md').write_text(notes_for_release, encoding='utf-8')

          payload = {
              "version": os.environ['VERSION'],
              "notes": release_notes,
              "pub_date": os.environ['PUB_DATE'],
              "platforms": {
                  "darwin-aarch64": {"signature": darwin_sig, "url": os.environ['DARWIN_URL']},
                  "darwin-x86_64":  {"signature": darwin_sig, "url": os.environ['DARWIN_URL']},
                  "linux-x86_64":   {"signature": linux_sig,  "url": os.environ['LINUX_URL']},
                  "windows-x86_64": {"signature": win_sig,    "url": os.environ['WINDOWS_URL']},
              }
          }

          with open('latest.json', 'w') as f:
              json.dump(payload, f, indent=2)

          print("Generated latest.json:")
          print(json.dumps(payload, indent=2))
          PYEOF

          # Verify it is valid JSON
          python3 -c "import json; json.load(open('latest.json')); print('JSON is valid')"

          # Upload to the draft release (overwrites any existing latest.json)
          gh release upload "$TAG" latest.json#latest.json --clobber

          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fx 'latest.json' >/dev/null; then
            echo "ERROR: latest.json was not found on release $TAG after upload" >&2
            gh release view "$TAG" --json assets -q '.assets[].name'
            exit 1
          fi

          echo "latest.json successfully uploaded to release $TAG"

      # Copy the changelog entry for this tag into the release body and publish
      # the draft. Runs after every asset (including latest.json) is uploaded,
      # so viewers never see the release before its files are ready.
      - name: Publish release with changelog notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ ! -s release-notes.md ]; then
            echo "ERROR: release-notes.md is missing or empty" >&2
            exit 1
          fi

          gh release edit "$TAG" \
            --notes-file release-notes.md \
            --draft=false

          echo "Release $TAG published with changelog notes"
